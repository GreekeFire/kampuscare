<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KampusCare</title>
<style>
  /* One accent, used only for things you act on: step numbers, links, the Ask button. */
  :root { --paper:#fbfaf7; --ink:#1b1a1f; --muted:#67646d; --rule:#e3e0d8; --accent:#4b2a78; --accent-bg:#efeaf5; --warn:#8a4b00; --warn-bg:#fbefdc; --red:#a3221b; --red-bg:#fcebe9; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; overflow-wrap:break-word; /* long links never widen the page */ }
  a { color:var(--accent); }
  header { display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:6px 12px; max-width:760px; margin:0 auto; padding:18px 16px 0; }
  .brand { font-weight:700; letter-spacing:-.01em; color:inherit; text-decoration:none; }
  header nav { display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 16px; }
  .urgent { background:none; border:0; padding:0; font:inherit; font-size:14px; color:var(--red); text-decoration:underline; text-underline-offset:3px; cursor:pointer; }
  .urgent.back { color:var(--muted); }
  .lang { font:inherit; font-size:14px; color:var(--muted); background:none; border:0; padding:0; cursor:pointer; }
  .lang:focus-visible { outline:2px solid var(--accent); outline-offset:2px; color:var(--accent); }
  main { max-width:760px; margin:0 auto; padding:8px 16px 150px; }

  /* Start screen: the knowledge base itself, so students see what it covers and where it came from. */
  .intro h1 { font-size:clamp(28px,5vw,40px); line-height:1.1; letter-spacing:-.025em; margin:40px 0 12px; max-width:16ch; }
  .intro .stance { color:var(--muted); max-width:56ch; margin:0 0 32px; }
  .index { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr)); gap:28px 40px; }
  .index h2 { font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 6px; padding-bottom:6px; border-bottom:1px solid var(--rule); }
  .index ul { list-style:none; margin:0; padding:0; }
  .index button { all:unset; display:block; width:100%; padding:7px 0; cursor:pointer; color:var(--ink); }
  .index button:hover, .index button:focus-visible { color:var(--accent); text-decoration:underline; text-underline-offset:3px; }
  .index .tag { font-size:11px; color:var(--warn); margin-left:6px; white-space:nowrap; }
  .plan-open { all:unset; display:block; cursor:pointer; margin:0 0 36px; padding:12px 0 12px 18px; border-left:3px solid var(--accent); }
  .plan-open strong { color:var(--accent); }
  .plan-open:hover strong, .plan-open:focus-visible strong { text-decoration:underline; text-underline-offset:3px; }
  .provenance { margin:32px 0 0; padding-top:12px; border-top:1px solid var(--rule); font-size:13px; color:var(--muted); }

  /* Conversation */
  .me { margin:28px 0 8px; font-weight:600; font-size:18px; letter-spacing:-.01em; }
  .reply { margin:0 0 12px; }
  .thinking { color:var(--muted); }
  .answer { margin:0 0 18px; padding:2px 0 2px 18px; border-left:3px solid var(--rule); }
  .answer h3 { margin:0; font-size:15px; font-weight:600; }
  .answer .why { margin:2px 0 10px; color:var(--muted); font-size:14px; }
  .steps { list-style:none; counter-reset:s; margin:0 0 10px; padding:0; }
  .steps li { counter-increment:s; position:relative; padding:5px 0 5px 36px; }
  .steps li::before { content:counter(s); position:absolute; left:0; top:5px; width:24px; height:24px; border-radius:50%; background:var(--accent); color:#fff; font-size:13px; font-weight:600; display:grid; place-items:center; }
  .notes { font-size:14px; color:var(--muted); margin:0 0 8px; }
  .meta { font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .sample { display:inline-block; margin:0 0 6px; padding:1px 7px; border-radius:3px; background:var(--warn-bg); color:var(--warn); font-size:12px; font-weight:600; }
  .approved { display:inline-block; margin:0 0 6px; padding:1px 7px; border-radius:3px; background:var(--accent-bg); color:var(--accent); font-size:12px; font-weight:600; }
  .none { color:var(--muted); }
  .offer { margin:8px 0 0; }
  .offer .meta { margin:4px 0 0; }
  .fb { font-size:13px; color:var(--muted); margin:4px 0 0; }
  .fb button { font:inherit; font-size:13px; background:none; border:1px solid var(--rule); border-radius:4px; padding:1px 10px; margin-left:6px; cursor:pointer; color:var(--ink); }
  .fb button:hover { border-color:var(--ink); }
  .fb input { font:inherit; font-size:16px; /* under 16px iOS zooms on focus */ border:1px solid var(--rule); border-radius:4px; padding:1px 8px; margin-left:6px; color:var(--ink); background:#fff; max-width:220px; }
  .err { color:var(--red); }
  .crisis { margin:16px 0; padding:16px 18px; background:var(--red-bg); border-left:3px solid var(--red); }
  .crisis h3 { margin:0 0 6px; color:var(--red); font-size:16px; }
  .crisis ul { margin:8px 0; padding-left:20px; }
  .crisis a { color:var(--red); font-weight:700; }

  /* Arrival plan */
  .plan-input { display:flex; flex-direction:column; gap:10px; align-items:flex-start; margin:0 0 28px; }
  .plan-input textarea { width:100%; min-height:96px; }
  .primary { height:44px; background:var(--accent); color:#fff; border:0; border-radius:8px; padding:0 20px; font:inherit; font-weight:600; cursor:pointer; }
  .primary:disabled { opacity:.45; cursor:wait; }
  .ghost { font:inherit; font-size:14px; background:none; border:1px solid var(--rule); border-radius:6px; padding:6px 14px; cursor:pointer; color:var(--ink); }
  .ghost:hover { border-color:var(--ink); }
  .plan h2 { font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:28px 0 8px; padding-bottom:6px; border-bottom:1px solid var(--rule); }
  .profile { padding:14px 18px; border-left:3px solid var(--accent); background:#fff; }
  .profile h2 { margin-top:0; color:var(--accent); border:0; padding:0; }
  .profile .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px 24px; margin:0 0 12px; }
  .profile label { font-size:12.5px; color:var(--muted); display:block; }
  .profile input, .profile select { font:inherit; font-size:16px; width:100%; border:0; border-bottom:1px solid var(--rule); background:none; padding:2px 0; color:var(--ink); }
  .profile input:focus, .profile select:focus { outline:none; border-bottom-color:var(--accent); }
  .items { list-style:none; margin:0; padding:0; }
  .items > li { display:grid; grid-template-columns:24px 1fr; gap:2px 10px; padding:9px 0; border-bottom:1px solid var(--rule); }
  .items > li > input { margin:4px 0 0; width:16px; height:16px; accent-color:var(--accent); }
  .items .due { font-weight:600; font-variant-numeric:tabular-nums; margin-right:8px; }
  .items .meta { grid-column:2; }
  .plan-actions { margin:28px 0 0; }
  @media print {
    header, form, .plan-input, .plan-actions, .profile button { display:none !important; }
    body { background:#fff; font-size:12pt; }
    main { padding:0; }
    .meta a::after { content:" (" attr(href) ")"; word-break:break-all; }
    .items > li { break-inside:avoid; }
  }

  /* Composer */
  form { position:fixed; inset:auto 0 0 0; background:var(--paper); border-top:1px solid var(--rule); padding:12px 16px calc(12px + env(safe-area-inset-bottom)); }
  form > div { max-width:760px; margin:0 auto; display:flex; gap:8px; align-items:flex-end; }
  textarea { flex:1; min-width:0; resize:none; border:1px solid #cfcbc1; border-radius:8px; background:#fff; padding:11px 12px; font:inherit; min-height:48px; max-height:140px; }
  textarea:focus { outline:2px solid var(--accent); outline-offset:-1px; border-color:transparent; }
  form button { height:48px; background:var(--accent); color:#fff; border:0; border-radius:8px; padding:0 20px; font:inherit; font-weight:600; cursor:pointer; }
  form button:disabled { opacity:.45; cursor:wait; }
  form p { max-width:760px; margin:6px auto 0; font-size:12px; color:var(--muted); }
  form .hint { color:var(--ink); }
  /* Surprise feature 3: photo and voice */
  form .icon { flex:none; width:44px; padding:0; display:grid; place-items:center; background:#fff; color:var(--ink); border:1px solid #cfcbc1; touch-action:none; -webkit-user-select:none; user-select:none; }
  form .icon:hover { border-color:var(--ink); }
  form .icon.rec { color:#fff; background:var(--red); border-color:var(--red); }
  form .icon[hidden], .thumb[hidden] { display:none; }
  .thumb { position:relative; flex:none; }
  .thumb img { display:block; width:48px; height:48px; object-fit:cover; border-radius:6px; border:1px solid var(--rule); }
  form .thumb button { position:absolute; top:-7px; right:-7px; width:22px; height:22px; padding:0; border-radius:50%; background:var(--ink); font-size:12px; line-height:1; }
  .shot { display:block; max-width:180px; max-height:180px; margin:28px 0 0; border-radius:6px; border:1px solid var(--rule); }
  .shot + .me { margin-top:8px; }
  .seen { margin:0 0 6px; font-size:14px; color:var(--muted); }
  .check { margin:0 0 12px; font-size:13px; color:var(--muted); }
  .check.caught { padding:8px 10px; border-radius:4px; background:var(--warn-bg); color:var(--warn); }
  .check ul { margin:4px 0 0; padding-left:18px; }
  /* Surprise feature 5: Make It Act */
  .act { margin:0 0 14px; padding:10px 14px; border-left:3px solid var(--accent); background:#fff; }
  .act h4 { margin:2px 0 6px; font-size:15px; }
  .act .chose { font-size:12px; color:var(--accent); font-weight:600; font-family:ui-monospace,monospace; }
  .act .mail { white-space:pre-wrap; font-size:14px; margin:0 0 8px; padding:8px 10px; background:var(--paper); border:1px solid var(--rule); border-radius:4px; }
  .act .items > li { display:block; }
  .act .items input { margin-right:8px; accent-color:var(--accent); }
  /* Wellbeing: breathe → book a counsellor → talk to a senior */
  #plan-open { margin-bottom:12px; }
  .wb-link { display:block; background:none; border:0; padding:0; margin:-8px 0 14px 21px; font:inherit; font-size:14px; color:var(--accent); text-decoration:underline; text-underline-offset:3px; cursor:pointer; }
  .breath { display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center; }
  /* Waves inside a circle: the water level (.level) rises on breathe-in and drains on breathe-out; --d is the current phase length. */
  .breath-box { position:relative; width:220px; height:220px; margin:16px 0; --d:1s; }
  .glow { position:absolute; inset:-12px; border-radius:50%; background:radial-gradient(circle, #7cc6d9 0%, #4fa3c7 50%, transparent 72%); filter:blur(18px); opacity:.25; transform:scale(.9); transition:transform var(--d) ease-in-out, opacity var(--d) ease-in-out; }
  .full .glow { opacity:.6; transform:scale(1.12); }
  .breath-circle { position:relative; height:100%; display:grid; place-items:center; }
  .breath-circle svg { position:absolute; inset:0; width:100%; height:100%; }
  .level { transform:translateY(150px); transition:transform var(--d) ease-in-out; }
  .full .level { transform:translateY(40px); }
  .wave { animation:wave 8s linear infinite; }
  .w2 { animation-duration:5.5s; animation-direction:reverse; }
  .w3 { animation-duration:3.8s; }
  @keyframes wave { to { transform:translateX(-200px); } }
  .bubble { fill:#fff; opacity:0; }
  .in .bubble { animation:rise 2.2s ease-in infinite; }
  @keyframes rise { 20% { opacity:.85; } to { opacity:0; transform:translateY(-70px); } }
  .ring { fill:none; stroke:#4fa3c7; stroke-width:1.5; }
  .pulse { animation:swell .6s ease-out; }
  @keyframes swell { 50% { transform:scale(1.04); } }
  .breath-label { position:relative; display:grid; justify-items:center; min-width:100px; padding:6px 14px; border-radius:14px; font-weight:600; color:var(--ink); transition:background .4s; }
  .run .breath-label { background:rgba(255,255,255,.8); box-shadow:0 1px 8px rgba(47,127,176,.2); }
  .breath-count { font-size:40px; line-height:1.1; font-variant-numeric:tabular-nums; }
  .fade { animation:fade .5s ease-out; }
  @keyframes fade { from { opacity:0; transform:translateY(6px); } }
  .dots { display:flex; gap:8px; }
  .dots span { width:10px; height:10px; border-radius:50%; border:1.5px solid var(--accent); }
  .dots .on { background:var(--accent); }
  .breath-tip { margin:0; min-height:1.55em; color:var(--muted); }
  .wb-row { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; }
  .checkin { text-align:center; }
  .checkin h3 { margin:20px 0 10px; font-size:16px; }
  .face { display:inline-flex; align-items:center; gap:6px; }
  .face[aria-pressed=true] { border-color:var(--accent); color:var(--accent); }
  .checkin .reply { margin:12px 0 8px; }
  .wb-highlight { outline:2px solid var(--accent); outline-offset:8px; border-radius:4px; }
  .phones { display:flex; gap:16px; overflow-x:auto; scroll-snap-type:x mandatory; padding:8px 2px 12px; counter-reset:f; }
  .phones figure { flex:none; width:156px; margin:0; scroll-snap-align:start; counter-increment:f; }
  .phones figcaption { position:relative; padding:8px 0 0 32px; font-size:14px; }
  .phones figcaption::before { content:counter(f); position:absolute; left:0; top:8px; width:24px; height:24px; border-radius:50%; background:var(--accent); color:#fff; font-size:13px; font-weight:600; display:grid; place-items:center; }
  .phone { height:280px; border:2px solid var(--ink); border-radius:22px; background:#fff; overflow:hidden; display:flex; flex-direction:column; font-size:11px; }
  .phone .top { padding:14px 10px 6px; font-weight:600; border-bottom:1px solid var(--rule); }
  .phone .body { flex:1; position:relative; padding:12px 10px; display:flex; flex-direction:column; gap:8px; }
  .phone .line { height:8px; border-radius:4px; background:var(--rule); }
  .phone .field { height:22px; border:1px solid var(--rule); border-radius:4px; }
  .phone .btn { align-self:stretch; height:22px; border-radius:6px; background:var(--accent); color:#fff; font-weight:600; display:grid; place-items:center; }
  .phone .new { position:absolute; right:10px; bottom:10px; align-self:auto; padding:0 10px; }
  .phone .tabs { display:flex; gap:4px; }
  .phone .tabs span { min-width:22px; height:18px; border-radius:9px; background:var(--rule); }
  .phone .tabs .target { padding:1px 7px; background:var(--accent-bg); }
  .phone .nav { display:flex; justify-content:space-around; align-items:center; padding:6px 4px 10px; border-top:1px solid var(--rule); color:var(--muted); }
  .phone .nav span { display:grid; justify-items:center; font-size:9px; }
  .phone .target { color:var(--accent); font-weight:700; }
  .tap { position:relative; }
  .tap::after { content:""; position:absolute; inset:-5px; border:2px solid var(--accent); border-radius:999px; animation:pulse 1.6s ease-out infinite; }
  @keyframes pulse { from { transform:scale(.9); opacity:1; } to { transform:scale(1.3); opacity:0; } }
  @media (prefers-reduced-motion: reduce) {
    .wave, .in .bubble, .pulse, .fade { animation:none; } /* the water level still rises and drains */
    .tap::after { animation:none; }
  }
  .demo-banner { margin:0 0 12px; padding:8px 10px; border-radius:4px; background:var(--warn-bg); color:var(--warn); font-size:14px; }
  .profile textarea { display:block; width:100%; margin-top:4px; font-size:16px; }
  .profile .primary { margin-top:12px; }
  .senior { display:flex; gap:12px; padding:14px 0; border-bottom:1px solid var(--rule); }
  .senior h3 { margin:0; font-size:15px; }
  .senior p { margin:2px 0; }
  .senior .ghost { margin-top:6px; }
  .avatar { flex:none; width:40px; height:40px; border-radius:50%; background:var(--accent-bg); color:var(--accent); font-weight:600; display:grid; place-items:center; }
</style>
</head>
<body>
<header>
  <a class="brand" href="/">KampusCare</a>
  <nav>
    <a class="urgent back" href="/" id="back" hidden></a>
    <button class="urgent" type="button" id="urgent"></button>
    <select class="lang" id="lang" aria-label="Language / 语言">
      <option value="en">English</option>
      <option value="zh">中文</option>
    </select>
  </nav>
</header>

<main id="chat">
  <section class="intro" id="intro">
    <h1 id="headline"></h1>
    <p class="stance" id="stance"></p>
    <button class="plan-open" type="button" id="plan-open"></button>
    <button class="plan-open" type="button" id="wb-open"></button>
    <div class="index" id="index"></div>
    <p class="provenance" id="provenance"></p>
  </section>
</main>

<form id="form">
  <div>
    <!-- No "capture" attribute, so phones offer both the camera and the gallery. -->
    <input type="file" id="photo" accept="image/*" hidden>
    <button type="button" class="icon" id="photo-btn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h4l2-3h6l2 3h4v12H3z"/><circle cx="12" cy="13.5" r="3.5"/></svg></button>
    <span class="thumb" id="thumb" hidden><img alt=""><button type="button" id="unphoto">✕</button></span>
    <button type="button" class="icon" id="mic" hidden><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <textarea id="input" rows="1" maxlength="1000"></textarea>
    <button id="send"></button>
  </div>
  <p id="note" hidden></p>
  <p id="footer"></p>
</form>

<script>
// Every piece of text the student sees, in both languages. App/menu names, phone numbers and hotline names stay as they are.
const STRINGS = {
  en: {
    headline: 'How do I do this at Kaplan?',
    stance: "Ask in your own words, in any language. KampusCare only answers from the Kaplan pages listed below. If your question isn't covered, it tells you who to ask instead of guessing. Type, snap a photo, or hold the mic to ask by voice.",
    composerHint: '📷 Photo or hold 🎤 the mic to talk.', micTap: 'Hold the mic button while you talk.',
    danger: 'In danger right now? Tap Urgent help at the top.',
    planOpen: 'New international student? ', planOpenCta: 'Get your first 2 weeks planned →',
    groups: {},
    provenance: (n, date, unverified) => `${n} topics from the Kaplan Singapore Student Handbook and contact list, last checked ${date}. ${unverified} still have Kaplan360 or LMS steps waiting to be confirmed by students.`,
    placeholder: 'e.g. how do I apply for leave?', inputLabel: 'Your question', ask: 'Ask',
    allTopics: '← All topics', urgent: 'Urgent help',
    footer: "AI-assisted (Google Gemini). Don't type your name, student ID or medical details. Check anything important with Student Services.",
    thinking: 'Checking the Kaplan handbook…',
    notCovered: "That isn't in KampusCare's Kaplan pages yet. Kaplan general enquiries: +65 6733 1877.",
    sendReview: 'Send this question to Student Services', privacy: 'Only your question is sent, no name or ID.',
    sent: 'Sent. Once Student Services approves an answer, KampusCare will be able to answer this.',
    fbAsk: 'Did this answer it?', yes: 'Yes', no: 'No', thanks: 'Thanks.', thanksDown: 'Thanks. Student Services: +65 6733 1877.',
    whatWrong: 'What went wrong?', reasons: { not_asked: 'Not what I asked for', incorrect: 'Incorrect/incomplete', slow: 'Slow/buggy' },
    others: 'Others', tellMore: 'Tell us more (optional)', send: 'Send',
    sample: 'App steps not yet confirmed', unverified: 'steps unverified', approved: (date) => `Approved by Student Services · ${date}`,
    checked: 'checked', source: 'source',
    offline: "Couldn't reach KampusCare. Check your connection and try again.",
    serverErrors: {},
    act: {
      doIt: 'Do it for me', working: 'Working on it…', chose: 'AI chose', none: 'Nothing to do automatically here.',
      email: (team) => `Drafted an email to ${team}`, to: 'To', subject: 'Subject', openMail: 'Open in my email app',
      mailNote: "Fill in the [placeholders], then send it yourself. Nothing is sent automatically.",
      reminder: (when) => `Made a reminder for ${when}`, addCal: 'Add to my calendar (.ics)',
      queued: 'Sent your question to Student Services', checklist: (title) => `Made a checklist: ${title}`,
    },
    photo: 'Add a photo or screenshot', removePhoto: 'Remove photo', defaultQ: 'What does this mean and what should I do?',
    photoHint: "Crop out your name, student ID and photo before sending. KampusCare doesn't keep your photo or voice clip; Google's Gemini reads it to answer.",
    photoTooBig: 'That photo is still too large after shrinking. Try cropping it or sending a screenshot.', photoBad: "That file couldn't be opened as a photo.",
    seen: 'In your photo: ', heard: 'You said: ', voiceMsg: '🎤 Voice message',
    check: { passed: '✓ Checked against the Kaplan pages by a second AI', fixed: 'Caught and fixed by a second AI:', contained: "Couldn't verify the AI's wording, so here are the original Kaplan steps.",
      caught: (where, wrong, kb) => `${where} said "${wrong}"; the Kaplan page says ${kb}.`, step: (n) => `step ${n}`, demo: 'Demo: mistake injected' },
    mic: 'Hold to ask by voice (up to 30 seconds)', recording: 'Recording… release to send.',
    micDenied: "Couldn't use the microphone. Check your browser's permission and try again.", micBad: "Couldn't read that recording. Please try again.",
    crisis: {
      title: "You don't have to go through this alone",
      intro: 'If you are in danger or thinking about ending your life, please reach out now. Someone is available 24 hours a day:',
      emergency: 'Emergency: ', sos: 'Samaritans of Singapore (SOS): ', or: ', or WhatsApp ', imh: 'mindline (national mental health helpline): ',
      after: 'When you\'re ready, Kaplan\'s counsellors can help too: Kaplan360 → "Academic" → "Counselling".',
    },
    plan: {
      title: 'Your first 2 weeks at Kaplan',
      stance: "Tell us about yourself in your own words and language. KampusCare builds a dated checklist only from the Kaplan pages it knows, and says what it can't answer. Don't include your name, passport or student ID.",
      aboutYou: 'About you', placeholder: "e.g. I'm from China, starting a Murdoch degree, arriving 20 Nov, under 18, staying in a hostel",
      generate: 'Generate plan', building: 'Building your plan from the Kaplan handbook…',
      understood: 'What we understood about you',

const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

// A Vercel timeout (504) or 413 comes back as HTML/text: that's "AI is busy", not "check your connection".
const postJson = async (url, body) => {
  const r = await post(url, body);
  try { return await r.json(); } catch (err) { if (!r.ok) return { error: 'The AI is busy right now. Please try again in a minute.' }; throw err; }
};

function showCrisis(into) {
  const c = S().crisis, d = el('div', 'crisis'), ul = el('ul');
  d.setAttribute('role', 'alert');
  const a = (href, text) => { const x = el('a', null, text); x.href = href; return x; };
  const li = (...parts) => { const x = el('li'); x.append(...parts); return x; };
  ul.append(li(c.emergency, a('tel:995', '995')),
    li(c.sos, a('tel:1767', '1767'), c.or, a('https://wa.me/6591511767', '9151 1767')),
    // IMH's 6389 2222 was retired for mindline 1771 (June 2025; forwarding ended 30 Sep 2025).
    li(c.imh, a('tel:1771', '1771'), c.or, a('https://wa.me/6566691771', '6669 1771')));
  d.append(el('h3', null, c.title), el('p', null, c.intro), ul, el('p', null, c.after));
  into.append(d); scroll();
}

const topicTitle = (e) => (lang === 'zh' && e.title_zh) || e.title.replace(/ \(.*\)$/, '');

// Start screen is built from knowledge.json, so it always matches what the bot can answer.
function renderIndex() {
  const index = document.getElementById('index');
  if (!kb || !index) return;
  const groups = { 'Getting started': [], 'Classes and exams': [], 'Money and admin': [], 'Health and wellbeing': [], 'Contacts': [] };
  kb.forEach((e) => (groups[e.group] ||= []).push(e));
  index.replaceChildren();
  for (const [name, entries] of Object.entries(groups)) {
    const sec = el('section'); sec.append(el('h2', null, S().groups[name] || name));
    const ul = el('ul');
    entries.forEach((e) => {
      const b = el('button', null, topicTitle(e)); b.type = 'button';
      if (e.sample) b.append(el('span', 'tag', S().unverified));
      b.onclick = () => ask(topicTitle(e));
      const li = el('li'); li.append(b); ul.append(li);
    });
    sec.append(ul); index.append(sec);
  }
  const latest = kb.map((e) => e.reviewed).sort().at(-1);
  document.getElementById('provenance').textContent = S().provenance(kb.length, fmtDate(latest), kb.filter((e) => e.sample).length);
}

// Re-labels the page chrome and the start screen. Answers already on screen keep their language.
function applyLang() {
  const t = S();
  document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : 'en';
  langSel.value = lang;
  document.getElementById('back').textContent = t.allTopics;
  document.getElementById('urgent').textContent = t.urgent;
  input.placeholder = t.placeholder; input.setAttribute('aria-label', t.inputLabel);
  sendBtn.textContent = t.ask;
  photoBtn.setAttribute('aria-label', t.photo); photoBtn.title = t.photo;
  unphoto.setAttribute('aria-label', t.removePhoto);
  micBtn.setAttribute('aria-label', t.mic); micBtn.title = t.mic;
  if (photo) showNote(t.photoHint);
  // Hint shares the footer line, so the fixed composer doesn't grow on phones.
  document.getElementById('footer').replaceChildren(el('span', 'hint', t.composerHint + ' '), t.footer);
  if (document.getElementById('headline')) {
    document.getElementById('headline').textContent = t.headline;
    document.getElementById('stance').textContent = t.stance;
    document.getElementById('plan-open').replaceChildren(t.planOpen, el('strong', null, t.planOpenCta));
    document.getElementById('wb-open').replaceChildren(t.wb.open, el('strong', null, t.wb.openCta));
    renderIndex();
  }
}

langSel.onchange = () => {
  lang = STRINGS[langSel.value] ? langSel.value : 'en';

// Steps come from the model: build nodes, never innerHTML. "\n" = line break, https URLs = links.
function stepItem(text) {
  const li = el('li');
  String(text).split('\n').forEach((line, i) => {
    if (i) li.append(el('br'));
    line.split(/(https:\/\/[^\s()<>]*[^\s()<>.,;:!?])/).forEach((part, j) => {
      if (j % 2 === 0) return li.append(part);
      const a = el('a', null, part); a.href = part; a.target = '_blank'; a.rel = 'noopener'; li.append(a);
    });
  });
  return li;
}

function answer(c) {
  const t = S(), d = el('div', 'answer');
  if (c.sample) d.append(el('span', 'sample', t.sample));
  if (c.approved) d.append(el('span', 'approved', t.approved(fmtDate(c.reviewed))));
  d.append(el('h3', null, c.title));
  if (c.why) d.append(el('p', 'why', c.why));
  const ol = el('ol', 'steps'); c.steps.forEach((s) => ol.append(stepItem(s))); d.append(ol);

// Longest side 1280px, JPEG quality 0.8: a phone photo drops to a few hundred KB, well under Vercel's 4.5 MB limit.
async function shrink(file) {
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, 1280 / Math.max(bmp.width, bmp.height)), c = document.createElement('canvas');
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); // transparent PNGs → white, not black
  g.drawImage(bmp, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.8);
}

// Hold to record. MediaRecorder gives webm/mp4, which Gemini's OpenAI-compatible endpoint rejects (wav/mp3 only),
// so the clip is decoded and re-encoded as 16 kHz mono 16-bit WAV: ~1 MB for 30 s.
const RATE = 16000, MAX_S = 30;
const dataUrl = (blob) => new Promise((ok, fail) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = fail; r.readAsDataURL(blob); });
async function toWav(blob) {
  const pcm = (await new OfflineAudioContext(1, 1, RATE).decodeAudioData(await blob.arrayBuffer())).getChannelData(0);
  const n = Math.min(pcm.length, RATE * MAX_S), v = new DataView(new ArrayBuffer(44 + n * 2));
  const str = (at, s) => [...s].forEach((ch, i) => v.setUint8(at + i, ch.charCodeAt(0)));
  str(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); str(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, RATE, true); v.setUint32(28, RATE * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); str(36, 'data'); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, pcm[i])) * 0x7fff, true);
  return dataUrl(new Blob([v], { type: 'audio/wav' }));
}
let rec = null;
async function startRec() {
  if (rec || sendBtn.disabled) return;
  const r = rec = { stop: false };
  try { r.stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch { rec = null; return showNote(S().micDenied, true); }
  if (r.stop) { r.stream.getTracks().forEach((tr) => tr.stop()); rec = null; return showNote(S().micTap); } // released while the permission prompt was up
  const chunks = [], m = r.m = new MediaRecorder(r.stream), started = Date.now();
  m.ondataavailable = (e) => chunks.push(e.data);
  m.onstop = async () => {
    r.stream.getTracks().forEach((tr) => tr.stop()); rec = null; micBtn.classList.remove('rec'); showNote(photo && S().photoHint);
    if (Date.now() - started < 600) return showNote(S().micTap); // a tap, not a question: say how it works
    let wav;
    try { wav = await toWav(new Blob(chunks, { type: m.mimeType })); } catch { return showNote(S().micBad, true); }
    ask(input.value, wav);
  };
  m.start(); micBtn.classList.add('rec'); showNote(S().recording);
  r.timer = setTimeout(stopRec, MAX_S * 1000);
}

const wave = (y, a) => `M0 ${y} q25 ${-a} 50 0${' t50 0'.repeat(7)} V240 H0Z`;
const WATER = `<svg viewBox="0 0 200 200" aria-hidden="true" focusable="false">
  <defs>
    <clipPath id="wb-clip"><circle cx="100" cy="100" r="99"/></clipPath>
    <linearGradient id="wb-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4fafc"/><stop offset="1" stop-color="#dcf0f6"/></linearGradient>
    ${[['#7cc6d9', '#4fa3c7'], ['#4fa3c7', '#2f7fb0'], ['#2f7fb0', '#1f5f8a']].map(([a, b], i) =>
      `<linearGradient id="wb-w${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`).join('')}
  </defs>
  <g clip-path="url(#wb-clip)">
    <rect width="200" height="200" fill="url(#wb-sky)"/>
    <g class="level">
      <path class="wave w1" d="${wave(-8, 6)}" fill="url(#wb-w0)" opacity=".5"/>
      <path class="wave w2" d="${wave(-2, 8)}" fill="url(#wb-w1)" opacity=".55"/>
      <path class="wave w3" d="${wave(4, 5)}" fill="url(#wb-w2)" opacity=".7"/>
    </g>
    ${[[60, 0, 3], [92, .8, 2], [128, .4, 3.5], [150, 1.4, 2.5], [76, 1.8, 2]].map(([x, s, r]) =>
      `<circle class="bubble" cx="${x}" cy="188" r="${r}" style="animation-delay:${s}s"/>`).join('')}
  </g>
  <circle class="ring" cx="100" cy="100" r="99"/>
</svg>`;

// Restart a one-shot CSS animation class.
const replay = (node, cls) => { node.classList.remove(cls); void node.offsetWidth; node.classList.add(cls); };

function breathing(box, finish, clear) {
  const t = S().wb, stage = el('div', 'breath-box'), circle = el('div', 'breath-circle'), label = el('div', 'breath-label');
  const phase = el('span'), count = el('span', 'breath-count'), dots = el('div', 'dots'), tip = el('p', 'breath-tip');
  phase.setAttribute('aria-live', 'polite'); count.setAttribute('aria-hidden', 'true'); // announce phase changes, not every second
  dots.setAttribute('role', 'img');
  const dot = [...Array(ROUNDS)].map(() => el('span'));
  let timer = null, sound = false, audio = null, cur = null;

  // Quiet 220 Hz sine whose volume follows the breath. Created on a click only, closed on stop/end.
  const VOL = 0.06;
  const soundOn = () => {
    const ctx = new AudioContext(), osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.frequency.value = 220; gain.gain.value = 0.0001; osc.connect(gain).connect(ctx.destination); osc.start();
    audio = { ctx, gain: gain.gain };
  };
  const soundOff = () => {
    if (!audio) return;
    const a = audio; audio = null;
    a.gain.setTargetAtTime(0, a.ctx.currentTime, 0.05); setTimeout(() => a.ctx.close(), 300); // fade, no click
  };
  // ponytail: sound switched on mid-hold stays silent until the next phase.
  const ramp = (ph, n) => {
    if (!audio || ph === 'hold') return;
    const g = audio.gain, now = audio.ctx.currentTime;
    g.cancelScheduledValues(now); g.setValueAtTime(g.value, now); g.linearRampToValueAtTime(ph === 'in' ? VOL : 0.0001, now + n);
  };

  const soundBtn = btn('ghost', t.sound(false), () => {
    sound = !sound; soundBtn.textContent = t.sound(sound); soundBtn.setAttribute('aria-pressed', sound);
    if (!timer) return;
    if (sound) { soundOn(); ramp(cur, Number(count.textContent)); } else soundOff();
  });
  soundBtn.setAttribute('aria-pressed', false); soundBtn.hidden = !window.AudioContext;
  const start = btn('primary', t.start), stop = btn('ghost', t.stop, () => { end(); start.focus(); });

  const setDots = (n) => { dot.forEach((d, i) => d.classList.toggle('on', i < n)); dots.setAttribute('aria-label', t.rounds(n)); };
  const end = () => {
    clearInterval(timer); timer = null; soundOff();
    stage.style.setProperty('--d', '1s'); stage.classList.remove('full', 'in', 'run');
    phase.textContent = count.textContent = tip.textContent = '';
    start.hidden = false; stop.hidden = true;
  };
  start.onclick = () => {
    let round = 0, i = 0, left = PATTERN[0][1];
    const show = () => {
      const [ph, n] = (cur = PATTERN[i][0], PATTERN[i]);
      stage.style.setProperty('--d', n + 's'); // set the duration before the level changes
      if (ph !== 'hold') stage.classList.toggle('full', ph === 'in');
      stage.classList.toggle('in', ph === 'in'); // bubbles only while breathing in
      phase.textContent = t[ph]; count.textContent = left; ramp(ph, n);
      replay(circle, 'pulse'); replay(phase, 'fade');
    };
    clear(); setDots(0); tip.textContent = t.tips[0];
    if (sound) soundOn();
    stage.classList.add('run'); show(); start.hidden = true; stop.hidden = false; stop.focus();
    timer = setInterval(() => {
      if (!box.isConnected) return end(); // page was rebuilt
      if (--left > 0) return (count.textContent = left);
      i = (i + 1) % PATTERN.length;
      if (i === 0) {
        setDots(++round);
        if (round === ROUNDS) { end(); return finish(); }
        tip.textContent = t.tips[round];
      }
      left = PATTERN[i][1]; show();
    }, 1000);
  };

  circle.innerHTML = WATER; circle.append(label); label.append(phase, count);
  stage.append(el('div', 'glow'), circle); dots.append(...dot); setDots(0); stop.hidden = true;
  box.append(stage, dots, tip, row(start, stop, soundBtn));
  return () => start.onclick();
}

function checkIn(into, again) {
  const t = S().wb, q = el('h3', null, t.feel), faces = el('div', 'wb-row'), out = el('div');
  q.tabIndex = -1;
  const book = () => document.getElementById('wb-book');
  for (const k of Object.keys(FACES)) {
    const b = btn('ghost face', null, () => {
      faces.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b));
      book().classList.remove('wb-highlight');
      out.replaceChildren(el('p', 'reply', t.feelReply[k]));
      if (k === 'same') out.append(row(btn('ghost', t.again, again), btn('ghost', t.book, () => book().scrollIntoView({ behavior: 'smooth' }))));
      if (k === 'worse') {
        const line = el('p', 'notes'), crisis = el('div');
        line.append(t.unsafe[0], btn('urgent', S().urgent, () => { crisis.replaceChildren(); showCrisis(crisis); crisis.scrollIntoView({ block: 'center' }); }), t.unsafe[1]);
        out.append(line, crisis);
        book().classList.add('wb-highlight');
        book().firstChild.scrollIntoView({ behavior: 'smooth', block: 'center' }); // keeps this reply in view just above
      }
    });
    b.innerHTML = svg(`<circle cx="12" cy="12" r="9"/><path d="M9 10h.01M15 10h.01"/><path d="${FACES[k]}"/>`, 26);
    b.append(t.feelings[k]); b.setAttribute('aria-pressed', false);
    faces.append(b);
  }
  out.setAttribute('role', 'status');
  into.replaceChildren(q, faces, out);
  q.focus();
}

// Phone-frame mockups drawn in HTML/CSS from the counselling entry's steps. Static markup, no user data.
const ICONS = ['<path d="M3 11l9-7 9 7M5 10v10h14V10"/>', '<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/>',
  '<path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/>', '<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>']
  .map((p) => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`);
const nav = (tap) => `<div class="nav">${ICONS.map((ic, i) => i === 1 ? `<span class="target${tap ? ' tap' : ''}">${ic}Academic</span>` : `<span>${ic}</span>`).join('')}</div>`;
const PHONES = [
  '<div class="top">Kaplan360</div><div class="body"><div class="line" style="width:60%"></div><div class="field"></div><div class="field"></div><div class="btn tap"></div></div>',
  `<div class="top">Kaplan360</div><div class="body"><div class="line"></div><div class="line" style="width:70%"></div><div class="line" style="width:85%"></div></div>${nav(true)}`,
  `<div class="top">Academic</div><div class="body"><div class="tabs"><span></span><span class="target tap">Counselling</span><span></span></div><div class="line"></div><div class="line" style="width:75%"></div></div>${nav(false)}`,
  `<div class="top">Counselling</div><div class="body"><div class="line"></div><div class="line" style="width:65%"></div><div class="btn new tap">+ New</div></div>${nav(false)}`,
];
function bookCounsellor(sec) {
  const t = S().wb, row = el('div', 'phones'), facts = el('div');
  PHONES.forEach((html, i) => {
    const fig = el('figure'), phone = el('div', 'phone');
    phone.innerHTML = html; phone.setAttribute('aria-hidden', 'true'); // the caption says the same thing
    fig.append(phone, el('figcaption', null, t.shots[i])); row.append(fig);
  });
  const done = el('button', 'ghost', t.booked); done.type = 'button';
  done.onclick = () => { const p = el('p', 'reply', t.wellDone); p.setAttribute('role', 'status'); done.replaceWith(p); };
  sec.append(row, el('p', 'meta', t.illustration), facts, done);
  kbReady.then(() => {
    const c = kb?.find((e) => e.id === 'counselling');
    if (!c) return;
    facts.append(el('p', 'notes', t.notes || c.notes), el('p', 'notes', t.reply),
      sourceMeta(`${c.contact} · ${S().checked} ${fmtDate(c.reviewed)} · `, c.source));
  });
}

function seniors(sec, preset = {}) {
  const t = S().wb, box = el('div', 'profile'), grid = el('div', 'grid'), out = el('div');
  const pick = (label, opts) => {
    const s = el('select'), lab = el('label', null, label);
    for (const [v, text] of Object.entries(opts)) { const o = el('option', null, text); o.value = v; s.append(o); }
    lab.append(s); grid.append(lab); return s;
  };
  const mode = pick(t.mode, t.modes), field = pick(t.field, t.fields), country = pick(t.country, t.countries);
  if (preset.buddy) { mode.value = 'buddy'; country.value = preset.country || 'other'; }
  const mind = el('textarea'), mindLab = el('label', null, t.mind); mind.maxLength = 500; mindLab.append(mind);
  const find = el('button', 'primary', t.find); find.type = 'button';
  box.append(grid, mindLab, find);
  sec.append(el('p', 'demo-banner', t.banner), el('p', 'demo-banner', t.notPro), el('p', null, t.seniorIntro), box, out);
  // Same idea as the server: a crisis phrase shows the crisis card instead, before anything else.
  const crisis = () => { if (!CRISIS_CLIENT.test(mind.value)) return false; out.replaceChildren(); showCrisis(out); return true; };
  find.onclick = () => {
    if (crisis()) return;
    const buddy = mode.value === 'buddy', list = matchSeniors(SENIORS, field.value, country.value, buddy);
    out.replaceChildren(...(list.length ? list.map((s) => seniorCard(s, country.value, crisis)) : [el('p', 'none', buddy ? t.noBuddy : t.noMatch)]));
  };
}

function seniorCard(s, country, crisis) {
  const t = S().wb, c = el('div', 'senior'), body = el('div'), av = el('span', 'avatar', s.name.split(' ').map((w) => w[0]).join(''));
  av.setAttribute('aria-hidden', 'true');
  const why = el('p', 'why'); why.append(el('strong', null, t.whyLabel), t.why(s, s.country === country, t.countries[s.country]));
  const b = el('button', 'ghost', t.request); b.type = 'button';
  b.onclick = () => { if (!crisis()) b.replaceWith(el('p', 'notes', t.confirm(s.name))); };
  body.append(el('h3', null, s.name), why, el('p', null, s.help[lang === 'zh' ? 1 : 0]), el('p', 'meta', `${t.speaks}: ${s.langs.join(', ')} · ${t.avail[s.avail]}`), b);
  c.append(av, body);
  return c;
}

function openWellbeing(preset) {
  preset = preset?.buddy ? preset : {}; // also an onclick handler: ignore the click event
  const open = document.getElementById('wellbeing');
  if (open && !preset.buddy) return open.scrollIntoView();
  open?.remove();
  const t = S().wb;
  document.getElementById('intro')?.remove();
  document.getElementById('back').hidden = false;
  form.hidden = true;
  const v = el('section', 'plan intro'); v.id = 'wellbeing';
  v.append(el('h1', null, t.title), el('p', 'stance', t.stance));
  const part = (title, fill, id) => { const s = el('section'); if (id) s.id = id; s.append(el('h2', null, title)); fill(s); v.append(s); };
  part(t.breathe, calm); part(t.book, bookCounsellor, 'wb-book'); part(t.senior, (s) => seniors(s, preset));
  chat.append(v);
  (preset.buddy ? v.lastChild : v).scrollIntoView();
}

document.getElementById('plan-open').onclick = openPlan;
document.getElementById('wb-open').onclick = openWellbeing;
form.onsubmit = (e) => { e.preventDefault(); ask(input.value); };
input.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(input.value); } };
document.getElementById('urgent').onclick = () => { const d = el('div'); chat.append(d); showCrisis(d); };
</script>
